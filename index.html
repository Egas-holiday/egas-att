<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出勤回報</title>
<!-- 加到主畫面的圖示與名稱 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="出勤回報">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f172a">
<!-- 先跟 Google 與元件主機建立連線，縮短等待時間 -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  html,body{margin:0;height:100%;background:#0f172a}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1f5f9}
  iframe.wait{opacity:0}
  iframe{transition:opacity .25s}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0f172a;color:#cbd5e1;font-family:-apple-system,"Noto Sans TC",sans-serif;font-size:15px;letter-spacing:.05em;transition:opacity .3s}
  #splash img{width:84px;height:84px;border-radius:20px}
  #splash .bar{width:120px;height:3px;border-radius:3px;background:#1e293b;overflow:hidden}
  #splash .bar i{display:block;width:40%;height:100%;background:#54a06e;border-radius:3px;animation:run 1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #splash.hide{opacity:0;pointer-events:none}
  #pushBg{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;font-family:-apple-system,"Noto Sans TC",sans-serif}
  #pushBg .pc{background:#fff;color:#0f172a;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box}
  #pushBg h3{margin:0 0 8px;font-size:19px}
  #pushBg p{margin:0 0 16px;font-size:15px;line-height:1.65;color:#475569}
  #pushBg .pb{display:flex;flex-direction:column;gap:10px}
  #pushBg button{font:inherit;font-size:16px;font-weight:700;border-radius:12px;padding:13px;border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a}
  #pushBg button.pri{background:#3f7a52;border-color:#3f7a52;color:#fff}
  #pushBg button.dan{color:#dc2626;border-color:#fecaca;background:#fff5f5}
  #vidBg{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;font-family:-apple-system,"Noto Sans TC",sans-serif}
  #vidBg .vh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
  #vidBg .vh b{flex:1;font-size:16px}
  #vidBg .vh button{font:inherit;font-size:15px;font-weight:700;color:#fff;background:#334155;border:0;border-radius:10px;padding:9px 14px}
  #vidBg video{flex:1;width:100%;min-height:0;background:#000}
  #vidBg .ve{color:#fca5a5;padding:16px;font-size:14px;line-height:1.6;word-break:break-all}
  #a2hs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;font-family:-apple-system,"Noto Sans TC",sans-serif;pointer-events:none}
  #a2hs .ac{pointer-events:auto;background:#fff;color:#0f172a;width:100%;max-width:460px;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25);padding:18px 18px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
  #a2hs .at{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  #a2hs .at img{width:48px;height:48px;border-radius:12px}
  #a2hs .at b{display:block;font-size:16.5px}
  #a2hs .at span{font-size:13px;color:#64748b}
  #a2hs ol{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.9;color:#334155}
  #a2hs ol b{color:#0f172a}
  #a2hs .ic{display:inline-block;vertical-align:-4px;width:20px;height:20px;color:#2563eb}
  #a2hs .ab{display:flex;gap:10px}
  #a2hs .ab button{flex:1;font:inherit;font-size:15.5px;font-weight:700;border-radius:12px;padding:12px;border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a}
  #a2hs .ab button.pri{background:#3f7a52;border-color:#3f7a52;color:#fff}
  #shBg{position:fixed;inset:0;z-index:70;background:#0f172a;display:flex;flex-direction:column;font-family:-apple-system,"Noto Sans TC",sans-serif;color:#fff}
  #shBg .sh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  #shBg .sh b{flex:1;font-size:17px}
  #shBg .sh button{font:inherit;font-size:15px;font-weight:700;color:#fff;background:#334155;border:0;border-radius:10px;padding:9px 14px}
  #shBg .sb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 10px}
  #shBg .sb .it{margin-bottom:14px}
  #shBg .sb .it span{display:block;font-size:13px;color:#94a3b8;margin:0 2px 6px}
  #shBg .sb img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;-webkit-touch-callout:default}
  #shBg .sf{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#111c33;border-top:1px solid #1e293b}
  #shBg .sf button{width:100%;font:inherit;font-size:17px;font-weight:800;border:0;border-radius:14px;padding:15px;background:#3f7a52;color:#fff}
  #shBg .sf p{margin:10px 2px 0;font-size:13px;line-height:1.6;color:#94a3b8;text-align:center}
  .msg{font-family:-apple-system,"Noto Sans TC",sans-serif;color:#e2e8f0;padding:40px 24px;line-height:1.7}
</style>
</head>
<body>
<script>
  /* ↓↓↓ 把 Apps Script 部署後的網址（結尾是 /exec）貼在這裡 ↓↓↓ */
  var GAS_URL = "https://script.google.com/macros/s/AKfycbwwm1j428gBgtsh-kMHKP2q2OQa5G-b_RX-Avwy_XfqmRwlPGzYHZdoOOg-XHJAQl0Y/exec";



  /* ───── 報表圖片：在最外層顯示，按一下用手機的分享選單傳到 LINE 或存到照片 ───── */
  function dataFile(u, name){
    var b = atob(u.split(",")[1]), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return new File([a], name, { type: "image/png" });
  }
  function showShare(list){
    var old = document.getElementById("shBg"); if (old) old.remove();
    var files = [];
    try { files = list.map(function(x){ return dataFile(x.url, x.name); }); } catch(e){}
    var can = false;
    try { can = !!(navigator.canShare && files.length && navigator.canShare({ files: files })); } catch(e){}
    var bg = document.createElement("div"); bg.id = "shBg";
    bg.innerHTML = '<div class="sh"><b>報表圖片</b><button type="button" data-x>關閉</button></div><div class="sb"></div>'
      + '<div class="sf">' + (can ? '<button type="button" data-s>分享' + (list.length > 1 ? " " + list.length + " 張圖片" : "圖片") + '</button><p>選 LINE 傳給聊天室，或選「儲存影像」存到相簿</p>'
                                  : '<p>長按圖片，選「儲存到照片」或「分享」</p>') + '</div>';
    var sb = bg.querySelector(".sb");
    list.forEach(function(x){
      var it = document.createElement("div"); it.className = "it";
      var sp = document.createElement("span"); sp.textContent = String(x.sh || "");
      var im = document.createElement("img"); im.src = x.url; im.alt = String(x.sh || "") + "報表";
      it.appendChild(sp); it.appendChild(im); sb.appendChild(it);
    });
    document.body.appendChild(bg);
    bg.querySelector("[data-x]").onclick = function(){ bg.remove(); };
    var sbtn = bg.querySelector("[data-s]");
    if (sbtn) sbtn.onclick = function(){
      navigator.share({ files: files }).catch(function(err){
        if (err && err.name === "AbortError") return;   // 使用者自己取消
        // 一次分享多張失敗時，改成一張一張分享
        if (files.length > 1) navigator.share({ files: [files[0]] }).catch(function(){});
      });
    };
  }

  /* ───── 教學影片：在最外層播放（影片放在這個網站的 videos 資料夾）───── */
  function playVideo(d, src){
    var old = document.getElementById("vidBg"); if (old) old.remove();
    var bg = document.createElement("div"); bg.id = "vidBg";
    bg.innerHTML = '<div class="vh"><b></b><button type="button">關閉</button></div><video controls playsinline autoplay preload="auto"></video>';
    bg.querySelector("b").textContent = String(d.t || "教學影片");
    document.body.appendChild(bg);
    var v = bg.querySelector("video"), sent = false;
    var url = "videos/" + String(d.f || "").replace(/[^a-z0-9_.-]/gi, "");
    function done(ended){
      if (sent) return; sent = true;
      try { v.pause(); } catch(e){}
      bg.remove();
      try { src.postMessage({ att:"video-done", ended: ended }, "*"); } catch(e){}
    }
    v.addEventListener("ended", function(){ done(true); });
    v.addEventListener("error", function(){
      var full = new URL(url, location.href).href;
      var p = document.createElement("div"); p.className = "ve";
      p.textContent = "影片讀取失敗，找不到：" + full + "　請確認 GitHub 的 videos 資料夾裡有這個檔案。";
      v.replaceWith(p);
    });
    bg.querySelector("button").onclick = function(){ done(false); };
    v.src = url;
    var pr = v.play(); if (pr && pr.catch) pr.catch(function(){});
  }


  /* ───── 加入主畫面教學（用瀏覽器打開時才顯示；從主畫面圖示打開就不顯示）───── */
  var A2HS_PROMPT = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); A2HS_PROMPT = e; });
  var SHARE_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var PLUS_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var DOTS_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  function isMobile(){ return isIOS() || /android/i.test(navigator.userAgent); }
  function inAppBrowser(){
    var ua = navigator.userAgent || "";
    if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger|teamplus|team\+/i.test(ua)) return true;
    // iPhone：Safari、Chrome、Edge、Firefox 以外的（例如公司 App、通訊軟體裡開啟的網頁）
    if (isIOS() && !isStandalone() && !/Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) return true;
    // Android：App 內嵌的網頁會帶「; wv)」
    if (/Android/i.test(ua) && /; wv\)/.test(ua)) return true;
    return false;
  }
  function a2hsSteps(){
    if (inAppBrowser()) return '<ol><li>你現在是在 App 裡開啟網頁，這裡不能加入主畫面</li><li>點右上角 ' + DOTS_SVG + ' 或「…」</li><li>選<b>「在瀏覽器中開啟」</b>（或「用 Safari 開啟」「用預設瀏覽器開啟」）</li><li>在 ' + (isIOS() ? 'Safari' : 'Chrome') + ' 打開後，再照畫面下方的教學加入主畫面</li></ol>';
    if (isIOS()) return '<ol><li>點畫面下方（或網址列旁）的<b>分享</b> ' + SHARE_SVG + '</li><li>往下滑，點<b>「加入主畫面」</b> ' + PLUS_SVG + '</li><li>名稱維持「出勤回報」，點右上角<b>「新增」</b></li><li>之後從主畫面的圖示打開</li></ol>';
    if (A2HS_PROMPT) return '<ol><li>點下方<b>「加入主畫面」</b>按鈕</li><li>再點<b>「安裝」</b>或<b>「新增」</b></li><li>之後從主畫面的圖示打開</li></ol>';
    return '<ol><li>點右上角 ' + DOTS_SVG + '</li><li>點<b>「加到主畫面」</b>或<b>「安裝應用程式」</b></li><li>再點<b>「新增」</b>或<b>「安裝」</b></li><li>之後從主畫面的圖示打開</li></ol>';
  }
  function a2hsClose(remember){
    var el = document.getElementById("a2hs"); if (el) el.remove();
    if (remember) try { localStorage.setItem("att_a2hs_skip", String(Date.now())); } catch(e){}
  }
  function showA2hs(force){
    if (isStandalone() || (!force && !isMobile())) return;
    if (!force){ var last = 0; try { last = Number(localStorage.getItem("att_a2hs_skip") || 0); } catch(e){} if (Date.now() - last < 7 * 864e5) return; }
    a2hsClose(false);
    var el = document.createElement("div"); el.id = "a2hs";
    el.innerHTML = '<div class="ac"><div class="at"><img src="apple-touch-icon.png" alt=""><div><b>加入主畫面，像 App 一樣使用</b><span>下次點圖示就能打開，也能開啟手機通知</span></div></div>'
      + a2hsSteps() + '<div class="ab"><button type="button" data-l>之後再說</button>'
      + (A2HS_PROMPT && !isIOS() && !inAppBrowser() ? '<button type="button" class="pri" data-i>加入主畫面</button>' : '<button type="button" class="pri" data-ok>知道了</button>') + '</div></div>';
    document.body.appendChild(el);
    el.querySelector("[data-l]").onclick = function(){ a2hsClose(true); };
    var ok = el.querySelector("[data-ok]"); if (ok) ok.onclick = function(){ a2hsClose(true); };
    var ins = el.querySelector("[data-i]");
    if (ins) ins.onclick = function(){
      var pr = A2HS_PROMPT; A2HS_PROMPT = null; a2hsClose(false);
      pr.prompt(); pr.userChoice.then(function(c){ if (c.outcome !== "accepted") a2hsClose(true); }).catch(function(){});
    };
  }


  /* 告訴網頁目前手機通知的狀態（顯示在「通知」按鈕上） */
  var STATE_SRC = null, PUSH_EP = "";
  function pushState(){
    return new Promise(function(done){
      var noSupport = !("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window);
      if (isIOS() && !isStandalone()) return done("need-install");
      if (noSupport) return done("unsupported");
      if (Notification.permission === "denied") return done("denied");
      navigator.serviceWorker.getRegistration().then(function(reg){ return reg ? reg.pushManager.getSubscription() : null; })
        .then(function(sub){ PUSH_EP = sub ? sub.endpoint : ""; done(sub && Notification.permission === "granted" ? "on" : "off"); })
        .catch(function(){ done("off"); });
    });
  }
  function sendState(src){
    src = src || STATE_SRC; if (!src) return;
    pushState().then(function(st){ try { src.postMessage({ att:"push-state", state: st, endpoint: st === "on" ? PUSH_EP : "" }, "*"); } catch(e){} });
  }

  /* ───── 手機推播通知 ───── */
  var PUSH = null;
  function b64uToU8(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
  function pushCard(title, text, btns){
    var bg = document.getElementById("pushBg");
    if (!bg){ bg = document.createElement("div"); bg.id = "pushBg"; document.body.appendChild(bg); bg.addEventListener("click", function(e){ if (e.target === bg) pushClose(); }); }
    bg.innerHTML = '<div class="pc"><h3></h3><p></p><div class="pb"></div></div>';
    bg.querySelector("h3").textContent = title; bg.querySelector("p").textContent = text;
    (btns || []).forEach(function(b){ var el = document.createElement("button"); el.textContent = b[0]; if (b[2]) el.className = b[2]; el.onclick = b[1]; bg.querySelector(".pb").appendChild(el); });
  }
  function pushClose(){ var bg = document.getElementById("pushBg"); if (bg) bg.remove(); }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function isStandalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
  function swUrl(){ return "sw.js?g=" + encodeURIComponent(GAS_URL) + "&t=" + encodeURIComponent(PUSH.token) + "&u=" + encodeURIComponent(location.href.replace(/[?&]_r=\d+/, "")); }
  function pushOpen(){
    var noSupport = !("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window);
    if (isIOS() && !isStandalone()){ pushCard("手機通知", "請先把網頁「加入主畫面」，再從主畫面的圖示打開，才能開啟通知。", [["看加入主畫面教學", function(){ pushClose(); showA2hs(true); }, "pri"], ["關閉", pushClose]]); return; }
    if (noSupport){ pushCard("手機通知", "這個瀏覽器不支援通知。iPhone 需要 iOS 16.4 以上，並從主畫面圖示打開；Android 請用 Chrome。", [["知道了", pushClose, "pri"]]); return; }
    if (Notification.permission === "denied"){ pushCard("通知已被封鎖", "請到手機「設定」→「通知」找到「出勤回報」，開啟「允許通知」後再試一次。", [["知道了", pushClose, "pri"]]); return; }
    navigator.serviceWorker.getRegistration().then(function(reg){
      return reg ? reg.pushManager.getSubscription() : null;
    }).then(function(sub){
      if (sub && Notification.permission === "granted"){
        pushCard("手機通知：已開啟", "有單位送出回報時，這支手機會跳出通知，畫面關著也會收到。", [
          ["傳送測試通知", function(){ pushCard("傳送中…", "請稍候", []); PUSH.src.postMessage({ att:"push-test", endpoint: sub.endpoint }, "*"); }, "pri"],
          ["關閉通知", function(){ pushOff(sub); }, "dan"],
          ["完成", pushClose]
        ]);
      } else {
        pushCard("開啟手機通知", "開啟後，有單位送出回報時，這支手機會跳出通知，畫面關著也會收到。", [["開啟通知", pushOn, "pri"], ["取消", pushClose]]);
      }
    }).catch(function(){ pushCard("開啟手機通知", "開啟後，有單位送出回報時，這支手機會跳出通知。", [["開啟通知", pushOn, "pri"], ["取消", pushClose]]); });
  }
  function pushOn(){
    // iPhone 規定：要在按下按鈕的當下詢問權限
    Notification.requestPermission().then(function(perm){
      if (perm !== "granted"){ pushCard("沒有開啟", "你沒有允許通知。想開啟時，再按一次「手機通知」。", [["知道了", pushClose, "pri"]]); return; }
      pushCard("設定中…", "請稍候", []);
      return navigator.serviceWorker.register(swUrl()).then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
        return reg.pushManager.getSubscription().then(function(sub){
          return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(PUSH.key) });
        });
      }).then(function(sub){
        PUSH.src.postMessage({ att:"push-sub", endpoint: sub.endpoint }, "*");
      });
    }).catch(function(err){
      var m = String(err && err.message || err);
      // 常見錯誤換成看得懂的說明
      if (/push service error|push service not available|AbortError/i.test(m))
        pushCard("這支手機目前連不上通知服務", "Android 的網頁通知要透過 Google 的通知服務。請確認：1. 用 Chrome 瀏覽器打開並加入主畫面；2. 手機有「Google Play 服務」且已更新（部分華為等手機沒有，就無法使用）；3. 公司 Wi-Fi 可能擋住通知服務，請改用行動網路再試一次。（" + m + "）", [["知道了", pushClose, "pri"]]);
      else if (/permission|denied/i.test(m))
        pushCard("通知權限沒有開", "請到手機「設定」→「應用程式」→ 瀏覽器（例如 Chrome）→「通知」，允許通知後再試一次。（" + m + "）", [["知道了", pushClose, "pri"]]);
      else pushCard("開啟失敗", "錯誤：" + m, [["知道了", pushClose, "pri"]]);
    });
  }
  function pushOff(sub){
    var ep = sub.endpoint;
    sub.unsubscribe().catch(function(){}).then(function(){
      PUSH.src.postMessage({ att:"push-unsub", endpoint: ep }, "*");
      setTimeout(function(){ sendState(PUSH.src); }, 300);
      pushCard("已關閉通知", "這支手機不會再收到新回報通知。", [["知道了", pushClose, "pri"]]);
    });
  }
  function pushResult(d){
    if (d.kind === "push-unsub") return;
    if (d.ok) pushCard(d.kind === "push-sub" ? "通知已開啟" : "已送出測試通知", "幾秒內會收到一則測試通知。沒收到的話，請確認手機沒有開「專注模式」或「勿擾」。", [["完成", pushClose, "pri"]]);
    else pushCard("設定失敗", d.error || "請稍後再試", [["知道了", pushClose, "pri"]]);
  }

  /* 把這個頁面網址後面的 ?page=...&key=... 原封不動交給 Apps Script，
     所以管理者、主管、回報三種網址都共用這一個頁面 */
  var q = location.search || "";
  if (!q){
    document.body.innerHTML = '<div class="msg">網址不完整，請使用管理者提供的專屬網址開啟。</div>';
  } else {
    var f = document.createElement("iframe");
    // wrap=1 讓回報頁知道是從外框頁開啟（狀態列由這一頁處理）
    f.src = GAS_URL + q + "&wrap=1";
    f.setAttribute("allow", "clipboard-write; clipboard-read; autoplay; web-share");
    f.title = "出勤回報";
    f.className = "wait";
    document.body.appendChild(f);
    // 載入畫面：網頁準備好就收起來（最多等 15 秒）
    var sp = document.createElement("div");
    sp.id = "splash";
    sp.innerHTML = '<img src="apple-touch-icon.png" alt=""><div>載入中</div><div class="bar"><i></i></div>';
    document.body.appendChild(sp);
    var done = false;
    function ready(){
      if (done) return; done = true;
      f.className = ""; sp.className = "hide";
      setTimeout(function(){ sp.remove(); }, 400);
      setTimeout(function(){ showA2hs(false); }, 2500);
    }
    window.addEventListener("message", function(e){
      var d = e.data; if (!d || !d.att) return;
      if (d.att === "ready") ready();
      if (d.att === "push-open"){ PUSH = { key: String(d.key || ""), token: String(d.token || ""), src: e.source }; pushOpen(); }
      if (d.att === "push-result"){ pushResult(d); sendState(); }
      if (d.att === "push-state-get"){ STATE_SRC = e.source; sendState(e.source); }
      if (d.att === "a2hs-show") showA2hs(true);
      if (d.att === "video-play") playVideo(d, e.source);
      if (d.att === "share-img" && Array.isArray(d.list)){
        var ls = d.list.filter(function(x){ return x && /^data:image\/png;base64,/.test(String(x.url || "")); }).slice(0, 6)
          .map(function(x){ return { url: String(x.url), sh: String(x.sh || "").slice(0, 10), name: String(x.name || "報表.png").replace(/[\\/:*?"<>|]/g, "_").slice(0, 60) }; });
        if (ls.length){ showShare(ls); try { e.source.postMessage({ att:"share-ok" }, "*"); } catch(err){} }
      }
      // 幫網頁記住設定（提醒開關、姓名、草稿等），關掉重開也不會不見
      if (d.att === "store-get"){
        var all = {};
        try { for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (/^att_/.test(k)) all[k] = localStorage.getItem(k); } } catch(err){}
        try { e.source.postMessage({ att:"store-data", d: all }, "*"); } catch(err){}
      }
      if (d.att === "store-set" && typeof d.k === "string" && /^att_[a-z0-9_]{1,40}$/.test(d.k)){
        try {
          if (d.v == null) localStorage.removeItem(d.k);
          else if (String(d.v).length < 20000) localStorage.setItem(d.k, String(d.v));
        } catch(err){}
      }
    });
    f.addEventListener("load", function(){ setTimeout(ready, 6000); });
    setTimeout(ready, 15000);
  }
</script>
</body>
</html>
